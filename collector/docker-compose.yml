# Collector for one GPU server. Copy .env.example to .env and fill it in, then:
#   docker compose up -d                        # NVIDIA server (needs NVIDIA Container Toolkit)
#   docker compose --profile cpu-only up -d cpu-collector   # server without GPU
services:
  gpu-collector:
    build: .
    image: gpu-monitor-collector:latest
    container_name: gpu-monitor-collector
    restart: unless-stopped
    env_file: .env
    # host network/pid: report the host's hostname, network traffic and load
    network_mode: host
    pid: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  cpu-collector:
    build: .
    image: gpu-monitor-collector:latest
    container_name: gpu-monitor-collector-cpu
    restart: unless-stopped
    env_file: .env
    network_mode: host
    pid: host
    profiles:
      - cpu-only
