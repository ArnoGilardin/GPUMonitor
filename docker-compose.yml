version: '3.8'

services:
  # Main application (API + Frontend)
  gpu-monitor:
    build: .
    container_name: gpu-monitor-central
    restart: unless-stopped
    # Port exposed internally only - use Nginx reverse proxy for external access
    expose:
      - "5100"
    environment:
      - NODE_ENV=production
      - PORT=5100
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - COLLECTOR_API_KEY=${COLLECTOR_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - FRONTEND_URL=${FRONTEND_URL}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gpu-monitor-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5100/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  # NOT exposed to host - only accessible via Docker network
  postgres:
    image: postgres:15-alpine
    container_name: gpu-monitor-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # No port mapping - internal network only
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gpu-monitor-network

  # Redis for session storage (optional)
  # NOT exposed to host - only accessible via Docker network
  redis:
    image: redis:7-alpine
    container_name: gpu-monitor-redis
    restart: unless-stopped
    # No port mapping - internal network only
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - gpu-monitor-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Nginx reverse proxy
  # Comment out or remove if using external reverse proxy (Caddy, Traefik, etc.)
  nginx:
    image: nginx:alpine
    container_name: gpu-monitor-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
    depends_on:
      gpu-monitor:
        condition: service_healthy
    networks:
      - gpu-monitor-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  gpu-monitor-network:
    driver: bridge
