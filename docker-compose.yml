services:
  # Main application (API + Frontend)
  gpu-monitor:
    build: .
    container_name: gpu-monitor-central
    restart: unless-stopped
    # Published on localhost only; use the nginx profile (or your own reverse proxy) for external access
    ports:
      - "127.0.0.1:${APP_PORT:-5100}:5100"
    environment:
      - NODE_ENV=production
      - PORT=5100
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - COLLECTOR_API_KEY=${COLLECTOR_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      - REQUIRE_SERVER_KEYS=${REQUIRE_SERVER_KEYS:-false}
      - DB_AUTO_MIGRATE=${DB_AUTO_MIGRATE:-true}
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gpu-monitor-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5100/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  # NOT exposed to host - only accessible via Docker network
  postgres:
    image: postgres:15-alpine
    container_name: gpu-monitor-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # No port mapping - internal network only
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gpu-monitor-network

  # Demo: 6 simulated GPU servers reporting with the global collector key.
  #   docker compose --profile demo up -d
  simulator:
    build: .
    container_name: gpu-monitor-simulator
    restart: unless-stopped
    entrypoint: []
    command: ["npx", "--yes", "tsx", "scripts/simulate.ts", "--url", "http://gpu-monitor:5100", "--servers", "6", "--interval", "15"]
    environment:
      - CENTRAL_API_KEY=${COLLECTOR_API_KEY}
    volumes:
      - ./scripts/simulate.ts:/app/scripts/simulate.ts:ro
    depends_on:
      gpu-monitor:
        condition: service_healthy
    networks:
      - gpu-monitor-network
    profiles:
      - demo

  # Nginx reverse proxy
  # Comment out or remove if using external reverse proxy (Caddy, Traefik, etc.)
  nginx:
    image: nginx:alpine
    container_name: gpu-monitor-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
    depends_on:
      gpu-monitor:
        condition: service_healthy
    networks:
      - gpu-monitor-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - production

volumes:
  postgres_data:

networks:
  gpu-monitor-network:
    driver: bridge
