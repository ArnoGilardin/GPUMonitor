version: '3.8'

services:
  # Main application (API + Frontend)
  gpu-monitor:
    build: .
    container_name: gpu-monitor-central
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-change-this}
      - COLLECTOR_API_KEY=${COLLECTOR_API_KEY:-collector-key-123}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:-alerts@gpu-monitor.com}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gpu-monitor-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: gpu-monitor-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-gpu_monitor}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gpu_monitor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gpu-monitor-network

  # Redis for session storage (optional)
  redis:
    image: redis:7-alpine
    container_name: gpu-monitor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - gpu-monitor-network

  # Nginx reverse proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: gpu-monitor-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
    depends_on:
      - gpu-monitor
    networks:
      - gpu-monitor-network
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  gpu-monitor-network:
    driver: bridge
